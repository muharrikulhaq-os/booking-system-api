version: "2"
sql:
  - engine: "postgresql"
    queries: "sql/query"
    schema: "sql/schema"
    gen:
      go:
        package: "repository"
        out: "internal/repository"
        emit_interface: true
        emit_json_tags: true
        # PENTING: kode (generated + hand-written serializers) memakai sql.NullXxx.
        # Jangan set emit_pointers_for_null_types — kalau true, regen menghasilkan
        # pointer (*string dsb) dan SEMUA serializer (.Valid/.Int32/...) rusak.
